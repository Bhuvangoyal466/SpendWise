services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://spendwise:spendwise@db:5432/spendwise
      - SECRET_KEY=change-me-in-production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=spendwise
      - POSTGRES_PASSWORD=spendwise
      - POSTGRES_DB=spendwise
    volumes:
      - spendwise_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  spendwise_pgdata:
